<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VerdeCoin - Mapa Brasil</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {font-family:Arial;height:100vh;}
.container {display:flex;height:100vh;}
.sidebar {width:350px;background:#fff;padding:20px;overflow-y:auto;border-right:2px solid #ddd;box-shadow:0 0 10px rgba(0,0,0,0.1);z-index:10;}
#map {flex:1;background:#e0e0e0;}
h1 {color:#333;margin-bottom:5px;font-size:24px;}
.subtitle {color:#999;font-size:12px;margin-bottom:20px;}
.card {background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:15px;border-radius:8px;margin:15px 0;text-align:center;}
.card h3 {margin:0 0 8px 0;font-size:12px;}
.card .num {font-size:28px;font-weight:bold;}
.card small {font-size:11px;opacity:0.9;}
.legend {background:#f5f5f5;padding:15px;border-radius:8px;margin:15px 0;border-left:4px solid #667eea;}
.legend h3 {margin:0 0 12px 0;font-size:14px;color:#333;}
.leg-item {display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px;}
.leg-color {width:20px;height:20px;border-radius:3px;box-shadow:0 0 5px rgba(0,0,0,0.2);}
.item {background:#f5f5f5;padding:12px;margin:10px 0;border-radius:5px;border-left:4px solid #667eea;font-size:12px;}
.item b {color:#333;}
.item .em {color:#e74c3c;font-weight:bold;font-size:13px;}
::-webkit-scrollbar {width:6px;}
::-webkit-scrollbar-thumb {background:#667eea;border-radius:3px;}
</style>
</head>
<body>
<div class="container">
<div class="sidebar">
<h1>🌱 VerdeCoin</h1>
<div class="subtitle">Mapa de Emissoes - PID Brasil</div>
<div class="card">
<h3>EMISSAO TOTAL</h3>
<div class="num">98,200</div>
<small>ton CO2</small>
</div>
<div class="card">
<h3>FOCOS ATIVOS</h3>
<div class="num">10</div>
</div>

<div class="legend">
<h3>🌡️ Escala de Intensidade</h3>
<div class="leg-item">
  <div class="leg-color" style="background:#28a745;"></div>
  <span>Baixa (0-30%)</span>
</div>
<div class="leg-item">
  <div class="leg-color" style="background:#ffc107;"></div>
  <span>Media (30-60%)</span>
</div>
<div class="leg-item">
  <div class="leg-color" style="background:#fd7e14;"></div>
  <span>Alta (60-80%)</span>
</div>
<div class="leg-item">
  <div class="leg-color" style="background:#dc3545;"></div>
  <span>Critica (80%+)</span>
</div>
</div>

<h3>🏆 Top 5 Maiores Emissores</h3>
<div id="toplist"></div>
</div>

<div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-heat/0.2.0/leaflet-heat.min.js"></script>

<script>
console.log("Iniciando mapa...");

const data = [
    {'latitude': -23.5505, 'longitude': -46.6333, 'intensity': 0.95, 'type': 'factory', 'name': 'Polo Industrial Sao Paulo', 'emission_tons_co2': 15000},
    {'latitude': -22.9068, 'longitude': -43.1729, 'intensity': 0.88, 'type': 'refinery', 'name': 'Complexo Petroquimico Rio', 'emission_tons_co2': 12000},
    {'latitude': -19.9191, 'longitude': -43.9386, 'intensity': 0.92, 'type': 'steel_factory', 'name': 'Siderurgica MG', 'emission_tons_co2': 14000},
    {'latitude': -12.9714, 'longitude': -38.5014, 'intensity': 0.85, 'type': 'chemical', 'name': 'Polo Quimico Bahia', 'emission_tons_co2': 10000},
    {'latitude': -27.5954, 'longitude': -48.5480, 'intensity': 0.78, 'type': 'paper_mill', 'name': 'Fabrica Celulose SC', 'emission_tons_co2': 8000},
    {'latitude': -3.1190, 'longitude': -60.0217, 'intensity': 0.91, 'type': 'deforestation', 'name': 'Garimpo Amazonas', 'emission_tons_co2': 13000},
    {'latitude': -23.4613, 'longitude': -46.4560, 'intensity': 0.72, 'type': 'vehicle', 'name': 'Corredor SP', 'emission_tons_co2': 6500},
    {'latitude': -15.8267, 'longitude': -56.0007, 'intensity': 0.68, 'type': 'agriculture', 'name': 'Agropecuaria MT', 'emission_tons_co2': 5500},
    {'latitude': -23.9545, 'longitude': -46.3033, 'intensity': 0.82, 'type': 'port', 'name': 'Porto Santos', 'emission_tons_co2': 9200},
    {'latitude': -25.4284, 'longitude': -49.2733, 'intensity': 0.65, 'type': 'food_industry', 'name': 'Polo Alimenticio PR', 'emission_tons_co2': 5000},
];

console.log("Dados carregados:", data.length, "focos");

// Criar mapa
const map = L.map('map').setView([-15, -55], 4);
console.log("Mapa criado");

// Adicionar tile layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'OpenStreetMap',
  maxZoom: 19
}).addTo(map);
console.log("Tile layer adicionado");

// Preparar dados para heatmap
const heatData = data.map(d => [d.latitude, d.longitude, d.intensity]);
console.log("Heat data points:", heatData.length);

// Adicionar heatmap com cores VIBRANTES
L.heatLayer(heatData, {
  radius: 50,
  blur: 30,
  maxZoom: 11,
  minOpacity: 0.3,
  gradient: {0: 'green', 0.3: 'yellow', 0.6: 'orange', 0.8: 'red', 1.0: 'darkred'}
}).addTo(map);
console.log("Heatmap adicionado");

// Funcao para cor baseada em intensidade
function getColor(intensity) {
  if (intensity > 0.8) return '#dc3545';
  if (intensity > 0.6) return '#fd7e14';
  if (intensity > 0.3) return '#ffc107';
  return '#28a745';
}

// Adicionar marcadores GRANDES e visíveis
data.forEach((d, idx) => {
  const color = getColor(d.intensity);
  const radius = 12 + (d.intensity * 15);
  
  L.circleMarker([d.latitude, d.longitude], {
    radius: radius,
    fillColor: color,
    color: '#ffffff',
    weight: 3,
    opacity: 1,
    fillOpacity: 0.85
  })
  .bindPopup(`
    <div style="font-size: 12px;">
      <b style="color: #333;">${d.name}</b><br>
      Tipo: ${d.type}<br>
      <span style="color: #dc3545; font-weight: bold; font-size: 14px;">${d.emission_tons_co2} ton CO2</span><br>
      Intensidade: ${(d.intensity*100).toFixed(1)}%
    </div>
  `)
  .addTo(map);
  
  console.log(`Marcador ${idx+1}: ${d.name} - Intensidade: ${d.intensity}`);
});

console.log("Marcadores adicionados");

// Top 5 - MELHORADO
const top = data.sort((a,b) => b.emission_tons_co2 - a.emission_tons_co2).slice(0,5);
const tophtml = top.map((e, i) => `
  <div class="item">
    <b>${i+1}. ${e.name}</b><br>
    <span class="em">${e.emission_tons_co2.toLocaleString('pt-BR')} ton CO2</span>
  </div>
`).join('');
document.getElementById('toplist').innerHTML = tophtml;

console.log("✅ Mapa carregado com sucesso!");
console.log("Top 5:", top.map(t => t.name));
</script>
</body>
</html>
